name: KinetMinutes
options:
  bundleIdPrefix: com.kinet
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M92UKS6NA2

packages:
  LocalLLMKit:
    path: ../LocalLLMKit

targets:
  KinetMinutes:
    type: application
    platform: macOS
    sources:
      - path: KinetMinutes
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: LocalLLMKit
        products:
          - LocalLLMKit
          - LocalLLMKitTranscription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinet.minutes.app
        PRODUCT_NAME: KinetMinutes
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Support/KinetMinutes.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        SWIFT_EMIT_LOC_STRINGS: true
        OTHER_LDFLAGS: "-lsqlite3"

schemes:
  KinetMinutes:
    build:
      targets:
        KinetMinutes: all
    run:
      config: Debug
